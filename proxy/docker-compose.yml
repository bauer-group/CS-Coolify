# =============================================================================
# BAUER GROUP - Hardened Coolify Traefik Proxy (OPTIONAL)
# =============================================================================
# Drop-in REPLACEMENT for Coolify's auto-generated Traefik proxy compose.
# Paste this into the Coolify UI:  Server -> Proxy -> Configuration  (editor),
# then Save + Restart Proxy. Pair it with the dynamic config in ./dynamic/
# (Server -> Proxy -> Dynamic Configurations). See ./README.md for full steps.
#
# -----------------------------------------------------------------------------
# READ THIS FIRST -- Coolify OWNS this file, not you. (Verified: Coolify 4.4.6)
# -----------------------------------------------------------------------------
# What Coolify does with the saved proxy compose:
#   Save / Start / Restart / server validation
#       -> stores and uses this text VERBATIM (comments included).
#   Traffic-analytics toggle (Server -> Analytics)
#       -> parses this file, adds/removes the analytics block, writes it back.
#          All keys survive, but ALL COMMENTS ARE LOST (YAML re-serialised).
#   "Reset configuration", proxy-type change, empty config
#       -> REGENERATION: rebuilds the compose from Coolify's template. It is
#          meant to keep custom `command:` flags whose prefix is not
#          template-owned, but Coolify 4.4.6 drops ALL of them on "Reset
#          configuration" (it regenerates without reading the saved config --
#          verified in a sandbox). Everything in this file reverts to stock.
#
# What that means for the hardening below:
#   [DURABLE]      everything in ./dynamic/ -- survives even a regeneration
#                  (the global TLS policy keeps applying; the bg-default
#                  middleware is then defined but no longer wired).
#   [DURABLE ADD]  custom flags: survive save/restart/analytics toggles; lost
#                  on "Reset configuration" in Coolify 4.4.6 (see above).
#   [BEST-EFFORT]  compose keys: survive save/restart/analytics toggles,
#                  revert to Coolify stock on a regeneration.
#   Anything reverted is harmless (a working, unhardened proxy). After a
#   "Reset configuration", re-paste this file and restart the proxy.
#   [COOLIFY-MANAGED] the traffic-analytics block (end of `command:` + the
#                  traefik-logrotate service). Keep it exactly as written while
#                  analytics is ON; delete both marked blocks if it is OFF.
#
# The load-bearing Coolify contract (container name, `coolify` network,
# `http`/`https` entrypoints, `letsencrypt` HTTP-01 resolver, docker + file
# providers, /traefik mount, extra_hosts, HTTP/3) is preserved BYTE-FOR-BYTE
# so every Coolify-deployed app keeps routing. Do not rename those.
# =============================================================================

name: coolify-proxy

networks:
  # [HARD CONSTRAINT] External network created by Coolify. Every deployed app
  # attaches here; the proxy MUST join it or nothing routes. Do not rename.
  coolify:
    external: true

services:
  traefik:
    # [HARD CONSTRAINT] Coolify drives the proxy lifecycle + status detection
    # purely by this container name (docker stop/rm/ps grep). Renaming makes
    # Coolify think the proxy is down and spawn a competing coolify-proxy that
    # collides on ports 80/443. Never change.
    container_name: coolify-proxy

    # [BEST-EFFORT] Pinned to v3.7 (tested) -- the same version Coolify 4.4's
    # template ships. Coolify never changes the image of a saved config; only
    # a regeneration sets it to the template version.
    image: traefik:v3.7
    restart: unless-stopped

    # [HARD CONSTRAINT] Lets Traefik reach host-bound services (Coolify relies
    # on this for some integrations). Kept identical to the stock template.
    extra_hosts:
      - host.docker.internal:host-gateway

    networks:
      - coolify

    # -------------------------------------------------------------------------
    # [BEST-EFFORT] Container-level hardening (reverts to stock on regen).
    # -------------------------------------------------------------------------
    # Traefik keeps exactly two Linux capabilities, everything else is dropped:
    #   NET_BIND_SERVICE  bind the privileged ports 80/443
    #   DAC_OVERRIDE      read/write /traefik. setup.sh and Coolify's own
    #                     installer create /data/coolify/proxy as 9999:root 0700;
    #                     without this capability root cannot even list it ->
    #                     no dynamic config (every router errors on the missing
    #                     bg-default@file), no acme.json, no access log.
    #                     The only other mount is docker.sock, which is root-
    #                     equivalent anyway, so this adds no real exposure.
    # Docker-socket access needs no capability: uid 0 == socket owner.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Graceful drain window for in-flight requests on stop/restart.
    stop_grace_period: 30s
    # OOM bias -- light protection only, per the BAUER GROUP OOM hierarchy:
    #   sshd/dockerd -500  >  Traefik -50 (this)  >  apps 0  >  monitoring +200
    # A reverse proxy without backends is dead weight, so it sits only slightly
    # above the app tier -- enough to outlive a restart loop, not artificially
    # shielded. Note: Coolify's stock proxy sets no oom bias at all.
    oom_score_adj: -50

    # -------------------------------------------------------------------------
    # Ports -- [HARD CONSTRAINT] for 80/443, dashboard port removed by choice.
    # -------------------------------------------------------------------------
    # Kept in Coolify's exact bare form (binds 0.0.0.0). We intentionally do
    # NOT add explicit [::] dual-stack bindings here: on a host without IPv6
    # a `[::]:80` publish can fail container start, and this array reverts on
    # regen anyway. IPv6 ingress is better handled at the host/DNS layer.
    #
    # The stock template also publishes `8080:8080` (Traefik dashboard). We
    # drop it: with `--api.insecure=false` nothing serves on :8080 in prod, so
    # it only ever exposed a dead port -- and we route no dashboard at all
    # (see labels + command). Dashboard = OFF by choice.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC) -- kept to match stock HTTP/3 support

    # -------------------------------------------------------------------------
    # [BEST-EFFORT] Docker log rotation + non-blocking driver (reverts on regen)
    # -------------------------------------------------------------------------
    # `mode: non-blocking` is the important bit: if the json-file ring buffer
    # fills, the kernel default BLOCKS the container's write() calls -- on an
    # edge proxy that stalls request handling behind log writes. Non-blocking
    # drops log lines instead (logs are non-critical, serving traffic is).
    # Coolify's stock proxy sets no logging block -> unbounded, blocking logs.
    logging:
      driver: json-file
      options:
        mode: non-blocking
        max-buffer-size: 4m
        max-size: 50m
        max-file: "5"

    volumes:
      # [HARD CONSTRAINT] Docker provider needs the socket. Kept :ro to match
      # stock (note: :ro on a unix socket protects the inode only, not the
      # Docker API -- but we keep Coolify's exact form for compatibility).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # [HARD CONSTRAINT] Coolify's proxy data dir. Maps to /traefik inside:
      #   host /data/coolify/proxy/dynamic/  -> /traefik/dynamic/  (file provider)
      #   host /data/coolify/proxy/acme.json -> /traefik/acme.json (ACME storage)
      # Coolify writes its reserved coolify.yaml here; your ./dynamic/*.yml go
      # alongside it. Do not change this mount.
      - /data/coolify/proxy/:/traefik

    # -------------------------------------------------------------------------
    # Command flags
    # -------------------------------------------------------------------------
    # [KEEP] = Coolify template-owned flags. Reproduced verbatim so a regen is
    #          a no-op for them. Removing/renaming these breaks Coolify or apps.
    # [DURABLE ADD] = BAUER GROUP additions whose prefix is NOT template-owned.
    #          Coolify's extractCustomProxyCommands() is meant to preserve them
    #          on regeneration; 4.4.6's "Reset configuration" loses them anyway.
    #
    # Do NOT try to add extra cert resolvers here (e.g. a DNS-01 cloudflare
    # resolver): the `--certificatesresolvers.` prefix is template-owned, so
    # Coolify silently DROPS custom resolvers on regen (and Traefik resolvers
    # are static-only, so the file provider can't hold them either). HTTP-01
    # `letsencrypt` is the only durable resolver in a Coolify proxy.
    command:
      # ---- Healthcheck ping endpoint (consumed by healthcheck below) --------
      # `--ping=true` matches the template prefix `--ping=` -> [KEEP] (regen
      # no-op). `--ping.entrypoint=http` does NOT start with `--ping=` (it's
      # `--ping.`), so Coolify treats it as a custom flag. The 4.4 template
      # ships it too, so the net effect is the same either way.
      - "--ping=true"
      - "--ping.entrypoint=http"

      # ---- [KEEP] API/dashboard feature enabled but NOT routed/exposed -------
      # api@internal exists internally; we publish no 8080 and define no
      # dashboard router (see labels) -> dashboard is unreachable = OFF.
      # `--api.` is template-owned, so trying to set it to false would revert
      # on regen anyway; leaving it as stock keeps a regen a no-op.
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # ---- [KEEP] Entrypoints http(:80) / https(:443) -- names are a HARD ---
      # CONSTRAINT: every Coolify-deployed app labels itself entrypoints=http /
      # entrypoints=https. Renaming breaks all deployed apps.
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--entrypoints.http.http.encodequerysemicolons=true"
      - "--entryPoints.http.http2.maxConcurrentStreams=250"
      - "--entrypoints.https.http.encodequerysemicolons=true"
      - "--entryPoints.https.http2.maxConcurrentStreams=250"
      - "--entrypoints.https.http3"

      # ---- [KEEP] Providers ---------------------------------------------------
      - "--providers.file.directory=/traefik/dynamic/"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # ---- [KEEP] ACME -- letsencrypt, HTTP-01 on the http entrypoint --------
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http"
      - "--certificatesresolvers.letsencrypt.acme.storage=/traefik/acme.json"

      # ---- [DURABLE ADD] respondingTimeouts (per entrypoint) -----------------
      # Prefix `--entrypoints.<ep>.transport.*` is NOT template-owned (see
      # [DURABLE ADD] above). Values mirror the BAUER GROUP EDGEPROXY stack:
      #   readTimeout=0s   no upper bound on request body -> large/slow uploads
      #                    (S3/MinIO multipart, mobile), long webhooks.
      #   writeTimeout=0s  no upper bound on response -> SSE / event-stream,
      #                    streaming downloads.
      #   idleTimeout=300s close keepalive after 5 min (bumped from Traefik's
      #                    180s so WebSocket apps that ping < every 3 min live).
      # Slowloris hardening: set readTimeout to e.g. 600s if you need a hard
      # single-connection cap (still allows 100 MB uploads on slow links).
      - "--entrypoints.http.transport.respondingTimeouts.readTimeout=0s"
      - "--entrypoints.http.transport.respondingTimeouts.writeTimeout=0s"
      - "--entrypoints.http.transport.respondingTimeouts.idleTimeout=300s"
      - "--entrypoints.https.transport.respondingTimeouts.readTimeout=0s"
      - "--entrypoints.https.transport.respondingTimeouts.writeTimeout=0s"
      - "--entrypoints.https.transport.respondingTimeouts.idleTimeout=300s"

      # ---- [DURABLE ADD] Global default middlewares (applied to ALL routers) --
      # Wires the bg-default chain (compression + security headers + BG brand)
      # from ./dynamic/bg-defaults.yml onto every router of each entrypoint --
      # every Coolify app AND Coolify's own UI/realtime routes -- with no
      # per-app labels (Coolify generates app labels itself, so an opt-in
      # toolbox would sit unused). Prefix `--entrypoints.<ep>.http.middlewares=`
      # is NOT template-owned (see [DURABLE ADD] above), and Coolify sets no
      # entrypoint middlewares itself, so there is no conflict.
      #
      # ---------------------------------------------------------------------
      # EXPECTED LOG NOISE -- do NOT "fix" this by dropping the http line.
      # ---------------------------------------------------------------------
      # Exactly once per proxy start, Traefik logs:
      #   ERR middleware "bg-default@file" does not exist routerName=ping@internal
      #   ERR middleware "bg-default@file" does not exist routerName=acme-http@internal
      # This is HARMLESS and self-heals in milliseconds. It is a Traefik startup
      # race, not a misconfiguration: Traefik applies its first config
      # generation as soon as the `internal` provider reports and does NOT wait
      # for the file provider (requiredProvider="internal" in
      # configurationwatcher.go; internal sends synchronously, file is
      # throttled). In that generation the two internal routers already exist
      # but the middleware map is still empty. Once the file config lands the
      # whole config is re-merged and both routers come up fine.
      # Upstream: traefik#9779 (kind/bug/confirmed, won't-fix for now).
      #
      # Verified against traefik:v3.7 with this exact config -- the runtime API
      # reports both routers status=enabled with mw=[bg-default@file], and
      # `wget -qO- http://localhost:80/ping` returns OK. Neither the healthcheck
      # nor the ACME HTTP-01 challenge is affected.
      #
      # Dropping the http line WOULD silence both lines (both internal routers
      # live on http via --ping.entrypoint=http and httpchallenge.entrypoint=
      # http, so http would then have no @file reference to resolve). We do NOT
      # do that: it strips bg-headers from plain-HTTP responses, and a service
      # that intentionally serves over HTTP would then leak its real backend --
      # measured: `Server: nginx/1.31.2` instead of `Server: BAUER GROUP Edge`.
      # Two documented, benign log lines beat losing that masking.
      # (Apps that redirect HTTP->HTTPS are unaffected either way -- Traefik
      # generates the 30x itself, so no backend header is ever exposed there.)
      #
      # HARD DEPENDENCY: ./dynamic/bg-defaults.yml MUST be installed (Server ->
      # Proxy -> Dynamic Configurations) BEFORE or together with this compose.
      # If it is missing, Traefik cannot resolve bg-default@file and EVERY router
      # (including the Coolify UI) errors -- permanently, not just at startup.
      # Install the dynamic file FIRST.
      - "--entrypoints.http.http.middlewares=bg-default@file"
      - "--entrypoints.https.http.middlewares=bg-default@file"

      # ---- [COOLIFY-MANAGED] Traffic analytics (Coolify 4.4+) ---------------
      # >>> BEGIN traffic analytics -- delete this block if analytics is OFF.
      # Coolify's exact flag set (bootstrap/helpers/proxy.php,
      # traefikAccessLogCommands): JSON access log at /traefik/access.log,
      # which Sentinel tails (read-only mount) for Server -> Analytics.
      # Keep the strings, their order and their position at the END of the
      # list unchanged: with the complete set present, Coolify recognises it
      # as its own -- a later analytics toggle replaces it instead of
      # duplicating it, and disabling analytics removes it cleanly. Your own
      # --accesslog.* flags would be hidden while analytics is on.
      # Privacy: full client IP, X-Forwarded-For, User-Agent, Referer and the
      # query string land in this file (see README -> Traffic analytics).
      - "--accesslog=true"
      - "--accesslog.filepath=/traefik/access.log"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.names.Cf-Connecting-Ip=keep"
      - "--accesslog.fields.headers.names.Cf-Ipcountry=keep"
      - "--accesslog.fields.headers.names.Cf-Cache-Status=keep"
      - "--accesslog.fields.headers.names.Cf-Verified-Bot=keep"
      - "--accesslog.fields.headers.names.Cf-Ray=keep"
      - "--accesslog.fields.headers.names.X-Forwarded-For=keep"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"
      # <<< END traffic analytics

    labels:
      # [HARD CONSTRAINT] Coolify management markers -- how Coolify recognises
      # this container as its managed proxy. Never remove.
      - coolify.managed=true
      - coolify.proxy=true
      # traefik.enable=false, as in Coolify 4.4's template: with `true` and no
      # router labels, Traefik's docker provider builds a router for the proxy
      # container ITSELF (Host(`traefik-coolify-proxy`)). Coolify identifies its
      # proxy by container name + coolify.* labels, not by this label.
      - traefik.enable=false
      # No dashboard router at all -> dashboard OFF. Coolify 4.4 no longer adds
      # one either (it even strips the legacy api@internal labels).

    healthcheck:
      # [HARD CONSTRAINT-ish] Kept identical to Coolify's stock check. Coolify's
      # status detection reads container state, not this check, but matching it
      # keeps a regen a no-op and avoids surprises.
      test: "wget -qO- http://localhost:80/ping || exit 1"
      interval: 4s
      timeout: 2s
      retries: 5

  # >>> BEGIN traffic analytics -- delete this service if analytics is OFF.
  # ---------------------------------------------------------------------------
  # [COOLIFY-MANAGED] Access-log rotation for traffic analytics (Coolify 4.4+)
  # ---------------------------------------------------------------------------
  # Traefik's access log has no size limit, so Coolify runs this sidecar:
  # above 20 MiB it copies access.log to access.log.1.gz and truncates it,
  # keeping 5 rotations (copy-truncate is safe: Traefik appends with O_APPEND,
  # Sentinel re-reads from 0 when the file shrinks). Service key, container
  # name and script are Coolify's own -- keep them unchanged, otherwise an
  # analytics toggle adds a second sidecar with the same container name.
  # The hardening keys below are [BEST-EFFORT]: every analytics toggle or
  # regeneration replaces this service with Coolify's stock definition.
  traefik-logrotate:
    container_name: coolify-proxy-logrotate
    image: alpine:3.24
    restart: unless-stopped
    network_mode: none
    volumes:
      - /data/coolify/proxy/:/traefik
    labels:
      - coolify.managed=true
    # [BEST-EFFORT] Same reasoning as for Traefik: root, but only
    # DAC_OVERRIDE to work in the 9999:root 0700 proxy directory. Without it
    # `stat` fails, the script reads size 0 and access.log grows unbounded.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    # No mem/pids limits on purpose: where the host cannot apply them
    # (rootless Docker, nested cgroups) the sidecar would fail to start and
    # make `compose up --wait` - and with it Coolify's proxy restart - fail.
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    # Coolify's rotation script, verbatim. `$$` is Compose's escape for a
    # literal `$` -- keep it, or Compose interpolates the variables away.
    entrypoint:
      - /bin/sh
      - -c
      - |-
        log="$${TRAEFIK_ACCESS_LOG:-/traefik/access.log}"
        max_bytes="$${TRAEFIK_ACCESS_LOG_MAX_BYTES:-20971520}"
        interval="$${TRAEFIK_ACCESS_LOG_ROTATE_INTERVAL:-60}"
        keep=5
        while true; do
          size=$$(stat -c %s "$$log" 2>/dev/null || echo 0)
          if [ "$$size" -gt "$$max_bytes" ]; then
            rm -f "$$log.$$keep.gz"
            i=$$((keep - 1))
            while [ "$$i" -ge 1 ]; do
              if [ -f "$$log.$$i.gz" ]; then mv -f "$$log.$$i.gz" "$$log.$$((i + 1)).gz"; fi
              i=$$((i - 1))
            done
            if cp "$$log" "$$log.1"; then
              : > "$$log"
              gzip -f "$$log.1"
            fi
          fi
          sleep "$$interval"
        done
  # <<< END traffic analytics
