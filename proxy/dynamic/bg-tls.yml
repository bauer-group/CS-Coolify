# =============================================================================
# BAUER GROUP - Traefik TLS Options (for Coolify's file provider)
# =============================================================================
# Install via Coolify UI: Server -> Proxy -> Dynamic Configurations -> add a
# file named `bg-tls.yml`. Durable -- Coolify never touches user files here.
#
# NAMED options only -- a router opts in per-app with a label:
#
#   traefik.http.routers.<router>.tls.options=bg-modern@file
#
# We deliberately do NOT define `tls.options.default` here. `default` would
# silently apply to EVERY router (including Coolify's own UI) and could collide
# with Coolify's reserved coolify.yaml if it ever sets its own default -- a
# hard-to-debug "which file wins" situation. Opt-in named options are the
# "voll kompatibel" choice.
#
# To make one of these the GLOBAL default anyway (only if you have confirmed
# Coolify's coolify.yaml does not define tls.options.default on your version):
# rename the block key from `bg-intermediate:` to `default:`. Then it applies
# to all routers without any per-app label.
# =============================================================================

tls:

  options:

    # ---- bg-modern -- TLS 1.3 only, no legacy clients ----------------------
    # For admin surfaces, payment flows, PCI-DSS workloads. Rejects anything
    # below TLS 1.3. sniStrict rejects handshakes with no matching SNI cert.
    bg-modern:
      minVersion: VersionTLS13
      sniStrict: true
      curvePreferences:
        - X25519
        - secp384r1
      alpnProtocols:
        - h2
        - http/1.1

    # ---- bg-intermediate -- TLS 1.2 minimum, modern AEAD only --------------
    # Mozilla "Intermediate" recipe. Excludes very old clients but keeps all
    # common 2018+ browsers / iOS 11+ / Android 5+. A sensible strong default
    # for modern Coolify apps -- rename this block to `default:` to globalise.
    bg-intermediate:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - X25519
        - secp521r1
        - secp384r1
        - secp256r1
      alpnProtocols:
        - h2
        - http/1.1

    # ---- bg-compat -- TLS 1.1 minimum, legacy-client support ---------------
    # The BAUER GROUP EDGEPROXY default posture: keeps legacy browsers and
    # feature phones (Android <5, KaiOS, old WebViews) online in regions where
    # they are still common. TLS 1.0 is intentionally NOT enabled (POODLE /
    # BEAST / SWEET32). Opt into this ONLY for apps that must serve such
    # clients -- it is weaker than bg-intermediate. bg-compat permits TLS 1.1,
    # CBC-SHA1 suites and non-PFS static-RSA key exchange: it FAILS PCI-DSS and
    # modern TLS compliance. Never use it for admin, payment, or sensitive-data
    # surfaces -- use bg-modern or bg-intermediate there.
    bg-compat:
      minVersion: VersionTLS11
      sniStrict: false
      cipherSuites:
        # TLS 1.3 ciphers negotiate automatically and are not listed.
        # TLS 1.2 modern AEAD
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        # TLS 1.2 legacy CBC (older Android, iOS 9, IE on Win7)
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA
        - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
        # TLS 1.2 RSA key-exchange (no PFS) -- last resort for very old clients
        - TLS_RSA_WITH_AES_128_GCM_SHA256
        - TLS_RSA_WITH_AES_256_GCM_SHA384
        - TLS_RSA_WITH_AES_128_CBC_SHA
        - TLS_RSA_WITH_AES_256_CBC_SHA
      curvePreferences:
        - X25519
        - secp521r1
        - secp384r1
        - secp256r1
      alpnProtocols:
        - h2
        - http/1.1
